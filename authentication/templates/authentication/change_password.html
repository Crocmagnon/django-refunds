{% extends 'base.html' %}
{% load crispy_forms_filters %}

{% block content %}
    <h1>{% block title %}Change password{% endblock %}</h1>

    <div id="login">
        <form method="post">
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}"/>
            {% endif %}
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Change password</button>
        </form>
    </div>
{% endblock %}
